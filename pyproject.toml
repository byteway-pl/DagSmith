[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-dagsmith"
dynamic = ["version"]
description = "Visual block-based and code DAG editor inside the Apache Airflow 3 UI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Galik" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "apache-airflow>=3.1.0",
    "alembic>=1.13",
    "sqlalchemy>=1.4",
    "pydantic>=2.0",
    "libcst>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "testcontainers[postgres]>=4",
]

[project.urls]
Homepage = "https://github.com/byteway-pl/DagSmith"
Issues = "https://github.com/byteway-pl/DagSmith/issues"

[project.entry-points."airflow.plugins"]
dagsmith = "dagsmith.plugin:DagSmithPlugin"

[tool.hatch.version]
path = "src/dagsmith/__init__.py"

# The built frontend bundle is git-ignored; `artifacts` ships it in both the
# sdist and the wheel anyway (unlike force-include it never duplicates paths
# when the wheel is built from an sdist, where VCS ignores don't apply).
[tool.hatch.build]
artifacts = ["src/dagsmith/static/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/dagsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Corpus files are byte-exact round-trip fixtures — never reformat them.
extend-exclude = ["tests/corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/dagsmith/core"]
